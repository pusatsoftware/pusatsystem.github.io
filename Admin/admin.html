<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Pusat Ultra | Yönetim Paneli</title>
    <link rel="stylesheet" href="admin.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="../app.js"></script>
</head>
<body>
    <div class="admin-container">
        <aside class="sidebar">
            <h1 class="logo">PUSAT<span>APP</span></h1>
            <nav>
                <div class="nav-item active">📊 Dashboard</div>
            </nav>
            <button id="logout" class="logout-btn">Güvenli Çıkış</button>
        </aside>

        <main class="content-area">
            <section class="glass-card">
                <h3>🚀 Hızlı Duyuru Yayınla</h3>
                <div class="announcement-form">
                    <input type="text" id="annTitle" placeholder="Duyuru Başlığı">
                    <textarea id="annMsg" placeholder="Mesajınızı buraya yazın..." spellcheck="false"></textarea>
                    <div class="form-footer">
                        <select id="annTarget">
                            <option value="all">Tüm Üyeler</option>
                        </select>
                        <button class="btn-neon" onclick="sendAnnouncement()">GÖNDER</button>
                    </div>
                </div>
            </section>

            <section class="glass-card">
                <h3>👥 Kayıtlı Üyeler</h3>
                <div class="user-table-container">
                    <div class="table-header">
                        <span>#</span>
                        <span>İsim</span>
                        <span>E-posta</span>
                        <span>Şifre</span>
                        <span style="text-align: right;">İşlem</span>
                    </div>
                    <div id="userDataRows" class="table-body">
                        </div>
                </div>
            </section>
        </main>
    </div>

    <div id="editModalOverlay" class="modal-overlay">
        <div class="edit-modal-card">
            <h3>✨ Üye Bilgilerini Güncelle</h3>
            <div class="edit-form">
                <div class="field">
                    <label>Kullanıcı Adı</label>
                    <input type="text" id="editName">
                </div>
                <div class="field">
                    <label>E-posta</label>
                    <input type="email" id="editEmail">
                </div>
                <div class="field">
                    <label>Şifre</label>
                    <input type="text" id="editPassword">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-neon" onclick="updateUser()">KAYDET</button>
                <button class="btn-cancel" onclick="closeModal()">İPTAL</button>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
