<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Pusat Pro | Admin</title>
    <link rel="stylesheet" href="admin.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="../app.js"></script>
</head>
<body>
    <div id="toastNotification" class="toast-box">✅ Duyuru Başarıyla Yayınlandı!</div>

    <div class="admin-wrapper">
        <aside class="sidebar">
            <h1 class="logo">PUSAT<span>PRO</span></h1>
            <div class="nav-item active">📊 Dashboard</div>
            <button id="logout" class="btn-exit">Çıkış</button>
        </aside>

        <main class="main-content">
            <section class="glass-card">
                <h3>🚀 Hızlı Duyuru</h3>
                <div class="ann-grid-system">
                    <div class="ann-main">
                        <input type="text" id="annTitle" placeholder="Duyuru Başlığı...">
                        <textarea id="annMsg" placeholder="Mesajınızı buraya yazın..."></textarea>
                    </div>
                    <div class="ann-side">
                        <div class="target-group">
                            <label>Hedef Kitle</label>
                            <select id="annTarget">
                                <option value="all">Herkes</option>
                            </select>
                        </div>
                        <button class="btn-ultra-modern" onclick="sendAnnouncement()">
                            <span>YAYINLA</span>
                            <div class="shimmer"></div>
                        </button>
                    </div>
                </div>
            </section>

            <section class="glass-card">
                <h3>👥 Kayıtlı Üyeler</h3>
                <div class="user-table">
                    <div class="t-header">
                        <span>#</span><span>İsim</span><span>E-posta</span><span>Şifre</span><span style="text-align:right">İşlem</span>
                    </div>
                    <div id="userDataRows"></div>
                </div>
            </section>
        </main>
    </div>

    <div id="editModalOverlay" class="modal-overlay">
        <div class="edit-card">
            <h3>✨ Bilgileri Güncelle</h3>
            <input type="text" id="editName" placeholder="İsim">
            <input type="email" id="editEmail" placeholder="E-posta">
            <input type="text" id="editPassword" placeholder="Şifre">
            <div class="modal-btns">
                <button class="btn-save" onclick="updateUser()">KAYDET</button>
                <button class="btn-close" onclick="closeModal()">İPTAL</button>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
