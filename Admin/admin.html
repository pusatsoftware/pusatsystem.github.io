<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Pusat Ultra | Yönetim</title>
    <link rel="stylesheet" href="admin.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="../app.js"></script>
</head>
<body>
    <div class="sidebar">
        <h1 class="logo-text">PUSAT</h1>
        <div class="nav-item active">📊 Dashboard</div>
        <button id="logout" class="btn-logout">Güvenli Çıkış</button>
    </div>

    <div class="main-content">
        <div class="glass-card">
            <h3>🚀 Hızlı Duyuru Yayınla</h3>
            <div class="form-vertical">
                <input type="text" id="annTitle" placeholder="Duyuru Başlığı">
                <textarea id="annMsg" placeholder="Duyuru mesajınızı buraya yazın..."></textarea>
                <select id="annTarget">
                    <option value="all">Tüm Üyelere Gönder</option>
                </select>
                <button class="btn-neon" onclick="sendAnnouncement()">YAYINLA</button>
            </div>
        </div>

        <div class="glass-card">
            <h3>👥 Kayıtlı Üyeler</h3>
            <div id="userListContainer" class="user-list-container">
                </div>
        </div>
    </div>

    <div id="editModalOverlay" class="modal-overlay">
        <div class="edit-modal-card">
            <h3>Üye Bilgilerini Güncelle</h3>
            <input type="text" id="editName" placeholder="İsim">
            <input type="email" id="editEmail" placeholder="E-posta">
            <input type="text" id="editPassword" placeholder="Şifre">
            <button class="btn-neon" onclick="updateUser()">✅ GÜNCELLE</button>
            <button class="btn-cancel" onclick="closeModal()">İptal</button>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
