<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Pusat Systems | Admin</title>
    <link rel="stylesheet" href="admin.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="../app.js"></script>
</head>
<body>
    <div class="admin-wrapper">
        <aside class="sidebar">
            <h1 class="logo-modern">Pusat<span>Systems</span></h1>
            
            <nav class="side-nav">
                <div class="nav-item active">
                    <span class="nav-icon">👥</span>
                    <span class="nav-text">Kullanıcılar</span>
                </div>
            </nav>

            <button id="logout" class="btn-exit-ultra">
                <span class="exit-icon">🚪</span>
                <span>ÇIKIŞ YAP</span>
                <div class="exit-glow"></div>
            </button>
        </aside>

        <main class="main-content">
            <section class="glass-card">
                <h3>👥 Kayıtlı Üyeler</h3>
                <div class="user-table">
                    <div class="t-header">
                        <span>#</span><span>İsim</span><span>E-posta</span><span>Şifre</span><span style="text-align:right">İşlem</span>
                    </div>
                    <div id="userDataRows"></div>
                </div>
            </section>
        </main>
    </div>

    <div id="editModalOverlay" class="modal-overlay">
        <div class="edit-card">
            <h3>✨ Bilgileri Güncelle</h3>
            <div class="modal-inputs">
                <input type="text" id="editName" placeholder="İsim">
                <input type="email" id="editEmail" placeholder="E-posta">
                <input type="text" id="editPassword" placeholder="Şifre">
            </div>
            <div class="modal-btns">
                <button class="btn-save-modern" onclick="updateUser()">KAYDET</button>
                <button class="btn-cancel-modern" onclick="closeModal()">İPTAL</button>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
