<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kullanıcı Paneli</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Pusat<b>App</b></div>
        <div class="nav-icons">
            <div class="notification-bell" onclick="toggleNoti()">
                🔔 <span id="notiCount" class="badge">0</span>
            </div>
            <button id="logoutBtn">Çıkış</button>
        </div>
    </nav>

    <div id="notiDropdown" class="noti-dropdown">
        <h3>Duyurular</h3>
        <div id="notiList">
            <p class="empty-msg">Henüz duyuru yok.</p>
        </div>
    </div>

    <main class="content">
        <h1>Hoş Geldin!</h1>
        <p>Burası senin kişisel panelin.</p>
    </main>

    <div id="liveToast" class="toast">
        <div class="toast-header">
            <strong>Yeni Duyuru!</strong>
            <button onclick="closeToast()">×</button>
        </div>
        <div id="toastBody" class="toast-body"></div>
    </div>

    <script src="index.js"></script>
</body>
</html>
