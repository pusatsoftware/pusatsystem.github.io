<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Pusat Uygulama | Panel</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Pusat<b>App</b></div>
        <div class="nav-right">
            <div class="bell-container" onclick="toggleDropdown()">
                🔔 <span id="notiBadge" class="badge">0</span>
                <div id="notiDropdown" class="dropdown">
                    <h4>Son Duyurular</h4>
                    <div id="notiItems"></div>
                </div>
            </div>
            <button id="logoutBtn" class="btn-logout">Çıkış</button>
        </div>
    </nav>

    <div class="hero-section">
        <h1 id="welcomeText">Yükleniyor...</h1>
        <p>Sistemden gelen tüm bildirimleri buradan takip edebilirsin.</p>
    </div>

    <div id="toastBox" class="toast">
        <div class="toast-content">
            <span id="toastTitle"><b>Yeni Duyuru!</b></span>
            <p id="toastMsg"></p>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
